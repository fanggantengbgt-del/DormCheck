<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obrolan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--s:#efeff4;--t:#15151f;--m:#6d6d82;--l:#e4e4ec;--a:#6a4cff;--b:#c92fae;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f15;--s:#1e1f2a;--t:#f3f3f9;--m:#9a9ab0;--l:#2b2c3a;--a:#8069ff;--b:#e046c2}}
:root[data-theme="dark"]{--bg:#0e0f15;--s:#1e1f2a;--t:#f3f3f9;--m:#9a9ab0;--l:#2b2c3a;--a:#8069ff;--b:#e046c2}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--t);font:15px/1.4 'Plus Jakarta Sans',system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#root,#app{height:100%}
#app{display:flex}
.mu{color:var(--m)}.pad{padding:16px}
.side{width:340px;flex:none;border-right:1px solid var(--l);display:flex;flex-direction:column;min-height:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--l)}
.sp{flex:1}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.who div{display:flex;flex-direction:column}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800}
.av.big{width:110px;height:110px;font-size:44px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--s)}
.ib.bk{display:none}
.snd{color:var(--a)}
.ib.rec{color:#fff;background:#e5334b;animation:p 1s infinite}
@keyframes p{50%{opacity:.55}}
.sr{display:flex;gap:8px;padding:12px 14px}
input{flex:1;min-width:0;border:1px solid var(--l);background:var(--s);border-radius:22px;padding:10px 16px}
.pri{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-radius:22px;padding:10px 18px;font-weight:600}
.pri:disabled{opacity:.6}
.cl{overflow:auto;flex:1}
.ci{display:flex;gap:12px;align-items:center;width:100%;padding:10px 14px;text-align:left}
.ci div{display:flex;flex-direction:column;min-width:0}
.ci small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci:hover,.ci.on{background:var(--s)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 14px;border-radius:22px;background:var(--s);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.m audio{display:block;max-width:100%;height:36px}
.m small{opacity:.75}
.cmp{display:flex;gap:6px;align-items:center;padding:10px 12px}
.empty{margin:auto;color:var(--m);text-align:center;padding:24px}
.auth{margin:auto;width:min(360px,90%);display:flex;flex-direction:column;gap:12px;padding:24px 0}
.auth h1{font-size:40px;margin:0;font-weight:800;letter-spacing:-.02em}
.auth input{border-radius:12px;padding:12px 14px}
.tabs{display:flex;background:var(--s);border-radius:12px;padding:3px}
.tabs button{flex:1;padding:8px;border-radius:10px;font-weight:600;color:var(--m)}
.tabs .on{background:var(--bg);color:var(--t)}
.er{color:#e5334b;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:99;max-width:90%}
#call{position:fixed;inset:0;z-index:50;background:#0c0c14;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#call[hidden]{display:none}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
#call.vid #rv{opacity:1}
#lv{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:96px;height:132px;object-fit:cover;border-radius:14px;background:#222;display:none;transform:scaleX(-1)}
#call.vid #lv{display:block}
#call>div{position:relative;text-align:center}
.cb{display:flex;gap:14px;margin-top:18px}
.cb button{padding:14px 22px;border-radius:30px;background:#2a2b3a;font-weight:600;color:#fff}
.cb .no{background:#e5334b}.cb .ok{background:#1fa463}.cb .on{background:#fff;color:#000}
.who div,.who small{min-width:0}.who small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{scroll-behavior:smooth}
.m{transform-origin:left bottom}.m.me{transform-origin:right bottom}
.m.in{animation:pop .32s cubic-bezier(.2,.9,.3,1.15)}
.m .sn{display:block;font-size:12px;color:var(--a)}
.m .tm{display:block;text-align:right;font-size:11px;opacity:.7;margin-top:2px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.92)}}
@keyframes fd{from{opacity:0}}
#root>*{animation:fd .4s ease}
#call:not([hidden]){animation:fd .3s ease}
.ci{transition:background .2s,transform .15s}.ci:active{transform:scale(.98)}
.ib,.pri,.tabs button{transition:background .2s,transform .15s,opacity .2s}.ib:active,.pri:active{transform:scale(.93)}
.rt{margin-left:auto;align-items:flex-end;gap:4px;flex:none}
.bd{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.bd.pp{animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.ci.un b,.ci.un small{color:var(--t);font-weight:800}
.sh{position:fixed;inset:0;z-index:40;background:#0007;display:grid;place-items:center;animation:fd .2s}
.sh form{background:var(--bg);width:min(380px,92%);padding:20px;border-radius:22px;display:flex;flex-direction:column;gap:10px;animation:pop .32s cubic-bezier(.2,.9,.3,1.15)}
.sh h2{margin:0}.sh input{flex:none}
@media (max-width:720px){#app{position:relative;overflow:hidden}.side,.main{position:absolute;inset:0;width:100%;border:0;background:var(--bg);transition:transform .4s cubic-bezier(.22,.8,.24,1),opacity .4s,visibility .4s}.main{transform:translateX(100%);visibility:hidden}#app.chat .main{transform:none;visibility:visible}#app.chat .side{transform:translateX(-22%);opacity:.4;visibility:hidden}.ib.bk{display:grid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body><div id="root"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc as fdoc,collection as fcol,getDoc,setDoc,updateDoc,addDoc,deleteDoc,onSnapshot as fsnap,query,where,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

/* === ISI DENGAN KONFIGURASI FIREBASE-MU: Project settings > Your apps > Web app === */
const firebaseConfig={apiKey:'ISI_API_KEY',authDomain:'ISI_PROJECT.firebaseapp.com',projectId:'ISI_PROJECT',appId:'ISI_APP_ID'};

const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app),MAIL='@obrolan.app';
/* adapter tipis: bentuknya sama dengan API db versi claude.ai, isinya Firestore */
const wrap=d=>({id:d.id,exists:d.exists(),data:()=>d.data()});
const wq=s=>({docs:s.docs.map(wrap),empty:s.empty});
const Q=(path,cs=[])=>({
  where:(f,o,v)=>Q(path,[...cs,where(f,o,v)]),
  orderBy:(f,d)=>Q(path,[...cs,orderBy(f,d)]),
  limit:n=>Q(path,[...cs,limit(n)]),
  onSnapshot:(n,e)=>fsnap(query(fcol(fs,path),...cs),x=>n(wq(x)),e),
  add:d=>addDoc(fcol(fs,path),d)
});
const D=path=>({
  get:async()=>wrap(await getDoc(fdoc(fs,path))),
  set:d=>setDoc(fdoc(fs,path),d),
  update:d=>updateDoc(fdoc(fs,path),d)
});
const db={doc:D,collection:p=>Q(p)};
/* sinyal panggilan & "sedang mengetik" lewat koleksi signals */
const room={emit:(t,d)=>addDoc(fcol(fs,'signals'),{...d,ts:Date.now()}),on:(t,f)=>{sigH=f}};
function startSig(u){
  unS=fsnap(query(fcol(fs,'signals'),where('to','==',u)),x=>x.docChanges().forEach(c=>{
    if(c.type!=='added')return;const d=c.doc.data();deleteDoc(c.doc.ref).catch(()=>{});
    if(Date.now()-d.ts<60000&&sigH)sigH({data:d});
  }),()=>{});
}

const $=s=>document.querySelector(s);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const svg=p=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="${p}"/></svg>`;
const IC={ph:'M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z',vi:'M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z',mi:'M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z',sd:'M2 21l21-9L2 3v7l15 2-15 2z',bk:'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',gp:'M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'};
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
let me,cur,chats=[],unC,unM,unR,unS,sigH,busy,shown,pc,peer,stream,pend,tmo,ice=[],rec,rchunks,rt,rstart,reads={},recent={},rsub={},typ={},pu={},lastTyp=0,fresh;
const root=$('#root'),buf={};
const UN=/^[a-z0-9_][a-z0-9_.]{1,18}[a-z0-9_]$/;
const hm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const cname=ch=>ch.grp?ch.name:(ch.members.find(x=>x!==me.u)||me.u);
const unread=ch=>ch.id===cur&&!document.hidden?0:(recent[ch.id]||[]).filter(m=>m.from!==me.u&&m.ts>(reads[ch.id]||0)).length;
function watch(ch){if(rsub[ch.id])return;rsub[ch.id]=db.collection('chats/'+ch.id+'/msgs').orderBy('ts','desc').limit(30).onSnapshot(sn=>{recent[ch.id]=sn.docs.map(d=>d.data());list()},()=>{})}
function mr(id,ts){if(!document.hidden&&ts>(reads[id]||0)){reads[id]=ts;db.doc('reads/'+me.u+'~'+id).set({u:me.u,c:id,ts}).catch(()=>{})}}
const toast=t=>{const e=E('div','toast',t);document.body.append(e);setTimeout(()=>e.remove(),3200)};
const av=(u,c='av')=>{const e=E('div',c,u[0].toUpperCase());e.style.background=`hsl(${Math.abs([...u].reduce((a,x)=>a*31+x.charCodeAt(0)|0,7))%360} 55% 45%)`;return e};

/* ---------- akun ---------- */
async function signup(u,p){
  u=u.trim().toLowerCase();
  if(!UN.test(u)||u.includes('..'))return 'Nama akun 3–20 karakter: huruf kecil, angka, _ atau titik (tidak berurutan).';
  if(p.length<6)return 'Kata sandi minimal 6 karakter.';
  busy=true;
  try{
    await createUserWithEmailAndPassword(auth,u+MAIL,p);
    let pid;for(let i=0;i<30;i++){pid=String(10000+Math.floor(Math.random()*90000));if(!(await db.doc('pids/'+pid).get()).exists)break}
    await db.doc('pids/'+pid).set({u});
    await db.doc('profiles/'+u).set({u,pid,ts:Date.now()});
    busy=false;await enter(u);
  }catch(e){busy=false;return e.code==='auth/email-already-in-use'?'Nama akun sudah dipakai.':'Gagal mendaftar. Coba lagi.'}
}
async function signin(u,p){
  try{await signInWithEmailAndPassword(auth,u.trim().toLowerCase()+MAIL,p)}
  catch(e){return ['auth/invalid-credential','auth/user-not-found','auth/wrong-password','auth/invalid-email'].includes(e.code)?'Nama akun atau kata sandi salah.':'Gagal masuk. Coba lagi.'}
}
async function find(q){
  q=q.trim().toLowerCase().replace(/^@/,'');let u=q;
  if(/^\d{5}$/.test(q)){const s=await db.doc('pids/'+q).get();if(!s.exists)return null;u=s.data().u}
  if(!UN.test(u))return null;
  const s=await db.doc('profiles/'+u).get();return s.exists?s.data():null;
}
async function enter(u){
  if(me&&me.u===u)return;
  const ps=await db.doc('profiles/'+u).get();if(!ps.exists)return signOut(auth);
  me=ps.data();mainView();startSig(u);
  unR=db.collection('reads').where('u','==',u).onSnapshot(sn=>{reads={};sn.docs.forEach(d=>reads[d.data().c]=d.data().ts||0);list()},()=>{});
  unC=db.collection('chats').where('members','array-contains',u).onSnapshot(sn=>{chats=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);chats.slice(0,50).forEach(watch);list()},()=>toast('Daftar chat gagal dimuat.'));
}
function logout(){endCall();unC&&unC();unM&&unM();unR&&unR();Object.values(rsub).forEach(f=>f());unC=unM=unR=null;rsub={};recent={};reads={};typ={};pu={};document.title='Obrolan';unS&&unS();unS=null;me=cur=null;chats=[];signOut(auth)}

/* ---------- tampilan ---------- */
function authView(){
  root.innerHTML=`<form class="auth" id="af"><h1>Obrolan</h1><p class="mu" style="margin:0">Chat, pesan suara, dan panggilan dengan teman. Data akunmu tetap ada setelah keluar.</p><div class="tabs"><button type="button" data-m="in" class="on">Masuk</button><button type="button" data-m="up">Daftar</button></div><input id="au" placeholder="Nama akun" autocomplete="username" autocapitalize="none" required><input id="ap" type="password" placeholder="Kata sandi" required><div class="er" id="ae" role="alert"></div><button class="pri" id="ab">Masuk</button></form>`;
  let mode='in';const tabs=root.querySelectorAll('.tabs button');
  tabs.forEach(b=>b.onclick=()=>{mode=b.dataset.m;tabs.forEach(x=>x.classList.toggle('on',x===b));$('#ab').textContent=mode=='in'?'Masuk':'Buat akun'});
  $('#af').onsubmit=async e=>{e.preventDefault();const b=$('#ab');b.disabled=true;$('#ae').textContent='';
    try{const r=await(mode=='in'?signin:signup)($('#au').value,$('#ap').value);if(r)$('#ae').textContent=r}catch(x){$('#ae').textContent='Gagal terhubung. Coba lagi.'}b.disabled=false};
}
function mainView(){
  root.innerHTML=`<div id="app"><aside class="side"><div class="hd"><div class="who" id="me"></div><button class="pri" id="lo" style="padding:8px 14px">Keluar</button></div><form class="sr" id="sf"><input id="sq" placeholder="Nama akun atau ID 5 angka" autocapitalize="none"><button class="pri">Mulai</button><button type="button" class="ib" id="gn" title="Grup baru">${svg(IC.gp)}</button></form><div class="cl" id="cl"></div></aside><section class="main" id="mn"><div class="empty">Pilih percakapan, atau cari temanmu lewat nama akun atau ID 5 angkanya.</div></section></div>
  <div id="call" hidden><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div id="cav"></div><div><b id="cn" style="font-size:20px"></b><br><span id="cst" class="mu"></span></div><div class="cb"><button id="cm">Bisukan</button><button id="ca" class="ok">Jawab</button><button id="ce" class="no">Akhiri</button></div></div>`;
  const d=E('div');d.append(E('b',0,'@'+me.u),E('small','mu','ID '+me.pid));$('#me').append(av(me.u),d);
  $('#lo').onclick=logout;$('#gn').onclick=groupSheet;
  $('#sf').onsubmit=async e=>{e.preventDefault();const q=$('#sq').value;if(!q.trim())return;
    try{const p=await find(q);if(!p)return toast('Akun tidak ditemukan.');if(p.u===me.u)return toast('Itu akunmu sendiri.');$('#sq').value='';openWith(p.u)}catch(x){toast('Pencarian gagal.')}};
  $('#ce').onclick=()=>endCall();$('#ca').onclick=acceptCall;
  $('#cm').onclick=()=>{const t=stream&&stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('#cm').classList.toggle('on',!t.enabled)}};
}
function list(){
  const c=$('#cl');if(!c)return;c.replaceChildren();
  if(!chats.length){c.append(E('p','mu pad','Belum ada percakapan. Masukkan nama akun atau ID 5 angka temanmu di atas.'));return}
  const u0=chats.reduce((a,x)=>a+unread(x),0);document.title=(u0?'('+u0+') ':'')+'Obrolan';
  for(const ch of chats){const o=cname(ch),n=unread(ch),b=E('button','ci'+(ch.id===cur?' on':'')+(n?' un':'')),t=E('div'),r=E('div','rt');
    t.append(E('b',0,o),E('small','mu',(ch.by===me.u?'Kamu: ':ch.grp&&ch.by?ch.by+': ':'')+(ch.last||'Mulai ngobrol')));
    r.append(E('small','mu',ch.last?hm(ch.ts):''));if(n)r.append(E('span','bd'+(pu[ch.id]!==n?' pp':''),n>29?'30+':n));pu[ch.id]=n;
    b.append(av(o),t,r);b.onclick=()=>openChat(ch.id);c.append(b)}
}
async function openWith(u){
  const id=[me.u,u].sort().join(':'),r=db.doc('chats/'+id);
  if(!(await r.get()).exists)await r.set({members:[me.u,u].sort(),last:'',ts:Date.now()});
  openChat(id);
}
function openChat(id){
  cur=id;unM&&unM();shown=new Set();fresh=false;const ch=chats.find(c=>c.id===id)||{id,members:id.split(':')},grp=!!ch.grp,o=cname(ch);
  $('#mn').innerHTML=`<div class="hd"><button class="ib bk" id="bk" title="Kembali">${svg(IC.bk)}</button><div class="who" id="ow"></div>${grp?'':`<button class="ib" id="c1" title="Panggilan suara">${svg(IC.ph)}</button><button class="ib" id="c2" title="Panggilan video">${svg(IC.vi)}</button>`}</div><div class="msgs" id="ms"></div><form class="cmp" id="cf"><input id="ci" placeholder="Tulis pesan" autocomplete="off"><button type="button" class="ib" id="mic" title="Rekam pesan suara">${svg(IC.mi)}</button><button class="ib snd" title="Kirim">${svg(IC.sd)}</button></form>`;
  {const d=E('div'),s=E('small','mu',grp?ch.members.join(', '):'');s.id='sub';d.append(E('b',0,o),s);$('#ow').append(av(o),d)}$('#app').classList.add('chat');list();
  $('#bk').onclick=()=>$('#app').classList.remove('chat');
  if(!grp){$('#c1').onclick=()=>call(o,false);$('#c2').onclick=()=>call(o,true)}$('#mic').onclick=mic;$('#ci').oninput=()=>typing(ch);
  $('#cf').onsubmit=e=>{e.preventDefault();const i=$('#ci'),t=i.value.trim();if(!t)return;i.value='';send({t:'text',body:t}).catch(()=>toast('Pesan gagal terkirim.'))};
  unM=db.collection('chats/'+id+'/msgs').orderBy('ts','desc').limit(100).onSnapshot(sn=>{
    const box=$('#ms');if(!box||cur!==id)return;
    const near=!box.dataset.s||box.scrollHeight-box.scrollTop-box.clientHeight<120;
    for(const d of sn.docs.slice().reverse()){if(shown.has(d.id))continue;shown.add(d.id);const m=d.data(),el=bubble(m,grp),p=box.lastChild;if(fresh){el.classList.add('in');typ[id]&&delete typ[id][m.from]}if(p&&p.dataset.f===m.from)el.style.marginTop='-3px';box.append(el)}
    if(near){box.style.scrollBehavior=fresh?'smooth':'auto';box.scrollTop=box.scrollHeight;box.dataset.s=1}
    fresh=true;showTyp();sn.docs[0]&&mr(id,sn.docs[0].data().ts);
  },()=>toast('Pesan gagal dimuat.'));
}
function bubble(m,grp){
  const b=E('div','m'+(m.from===me.u?' me':''));b.dataset.f=m.from;if(grp&&m.from!==me.u)b.append(E('b','sn',m.from));
  if(m.t==='voice'&&/^data:audio\//.test(m.body)){const a=E('audio');a.controls=true;a.preload='metadata';a.src=m.body;b.append(a)}
  else b.append(String(m.body||''));
  b.append(E('small','tm',(m.t==='voice'?(m.dur||0)+' dtk  ':'')+hm(m.ts)));return b;
}
async function send(m){
  const t=Date.now();
  await db.collection('chats/'+cur+'/msgs').add({from:me.u,ts:t,...m});
  await db.doc('chats/'+cur).update({last:m.t==='voice'?'Pesan suara':m.body.slice(0,60),ts:t,by:me.u});
}

/* ---------- grup & mengetik ---------- */
function groupSheet(){
  const s=E('div','sh');
  s.innerHTML='<form><h2>Grup baru</h2><input id="gnm" placeholder="Nama grup" maxlength="30" required><input id="gmb" placeholder="Anggota: nama akun atau ID, pisahkan koma" autocapitalize="none" required><div class="er" id="ger"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="gx" style="padding:0 14px">Batal</button><button class="pri" id="gok">Buat grup</button></div></form>';
  document.body.append(s);$('#gnm').focus();
  const close=()=>s.remove();$('#gx').onclick=close;s.onclick=e=>{if(e.target===s)close()};
  s.querySelector('form').onsubmit=async e=>{
    e.preventDefault();const b=$('#gok'),er=$('#ger');b.disabled=true;er.textContent='';
    try{
      const names=new Set([me.u]);
      for(const q of $('#gmb').value.split(/[,\s]+/).filter(Boolean)){const p=await find(q);if(!p){er.textContent='Akun “'+q+'” tidak ditemukan.';b.disabled=false;return}names.add(p.u)}
      if(names.size<3){er.textContent='Tambahkan minimal 2 anggota selain kamu.';b.disabled=false;return}
      const id='g'+Math.random().toString(36).slice(2,10),ch={members:[...names].sort(),name:$('#gnm').value.trim(),grp:true,last:'',ts:Date.now(),owner:me.u};
      await db.doc('chats/'+id).set(ch);close();chats.unshift({id,...ch});watch({id});openChat(id);
    }catch(x){er.textContent='Gagal membuat grup. Coba lagi.';b.disabled=false}
  };
}
function typing(ch){if(Date.now()-lastTyp<2500)return;lastTyp=Date.now();ch.members.forEach(m=>m!==me.u&&sig(m,'typ',{c:ch.id}))}
function showTyp(){
  const s=$('#sub');if(!s||!cur)return;const ch=chats.find(c=>c.id===cur),g=ch&&ch.grp;
  const n=Object.entries(typ[cur]||{}).filter(x=>Date.now()-x[1]<3200).map(x=>x[0]);
  s.textContent=n.length?(g?n.join(', ')+' sedang mengetik…':'sedang mengetik…'):(g?ch.members.join(', '):'');
}
/* ---------- pesan suara ---------- */
async function mic(){
  const b=$('#mic');
  if(rec&&rec.state==='recording'){rec.stop();return}
  if(!window.MediaRecorder)return toast('Perekaman tidak didukung di browser ini.');
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
    rec=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:16000}:{});rchunks=[];rstart=Date.now();
    rec.ondataavailable=e=>rchunks.push(e.data);
    rec.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop());clearTimeout(rt);b.classList.remove('rec');
      const dur=Math.round((Date.now()-rstart)/1000);if(dur<1)return;
      const body=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(new Blob(rchunks,{type:rec.mimeType}))});
      if(body.length>235000)return toast('Pesan suara terlalu besar. Rekam lebih singkat.');
      send({t:'voice',body,dur}).catch(()=>toast('Pesan suara gagal terkirim.'));
    };
    rec.start();b.classList.add('rec');rt=setTimeout(()=>rec.stop(),30000);
  }catch(e){toast('Mikrofon tidak bisa diakses. Periksa izin browser.')}
}

/* ---------- panggilan suara & video (WebRTC, sinyal lewat room) ---------- */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function sig(to,k,d={}){
  if(!room)return;const s=JSON.stringify(d),id=Math.random().toString(36).slice(2),n=Math.max(1,Math.ceil(s.length/2500));
  for(let i=0;i<n;i++)room.emit('sig',{to,from:me.u,k,id,i,n,p:s.slice(i*2500,(i+1)*2500)}).catch(()=>{});
}
function onMsg(m){
  const x=m.data;if(!me||!x||x.to!==me.u||typeof x.id!=='string'||!(x.n>=1&&x.n<=12)||!(x.i>=0&&x.i<x.n))return;
  const b=buf[x.id]??={n:x.n,p:[]};b.p[x.i]=String(x.p);
  if(b.p.filter(v=>v!=null).length===b.n){delete buf[x.id];try{onSig(String(x.from),x.k,JSON.parse(b.p.join('')))}catch(e){}}
}
async function media(v){stream=await navigator.mediaDevices.getUserMedia({audio:true,video:v?{facingMode:'user'}:false});$('#lv').srcObject=stream}
function mk(){
  pc=new RTCPeerConnection(ICE);
  pc.onicecandidate=e=>e.candidate&&sig(peer,'ice',e.candidate.toJSON());
  pc.ontrack=e=>{$('#rv').srcObject=e.streams[0]};
  pc.onconnectionstatechange=()=>{const s=pc&&pc.connectionState;if(s==='connected'){clearTimeout(tmo);$('#cst').textContent='Terhubung'}if(s==='failed'){toast('Sambungan gagal. Jaringan mungkin memblokir panggilan.');endCall()}};
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
}
function show(n,s,v,inc){
  const c=$('#call');c.hidden=false;c.classList.toggle('vid',!!v);$('#cn').textContent=n;$('#cst').textContent=s;
  $('#ca').hidden=!inc;$('#cm').hidden=!!inc;$('#cav').replaceChildren(av(n,'av big'));
}
async function call(o,v){
  if(!room)return toast('Panggilan tidak tersedia di tampilan ini.');
  if(pc||pend)return toast('Kamu sedang dalam panggilan.');
  try{
    await media(v);peer=o;mk();
    const of=await pc.createOffer();await pc.setLocalDescription(of);
    sig(o,'offer',{sdp:{type:of.type,sdp:of.sdp},video:v});show(o,'Memanggil…',v);
    tmo=setTimeout(()=>{toast(o+' tidak menjawab. Pastikan temanmu sedang membuka Obrolan.');endCall()},45000);
  }catch(e){toast('Kamera atau mikrofon tidak bisa diakses.');endCall(false)}
}
async function acceptCall(){
  if(!pend)return;const{f,d}=pend;clearTimeout(tmo);
  try{
    await media(d.video);mk();await pc.setRemoteDescription(d.sdp);
    const a=await pc.createAnswer();await pc.setLocalDescription(a);
    sig(f,'answer',{type:a.type,sdp:a.sdp});pend=null;flush();show(f,'Menyambungkan…',d.video);
  }catch(e){toast('Kamera atau mikrofon tidak bisa diakses.');endCall()}
}
const flush=()=>ice.splice(0).forEach(c=>pc&&pc.addIceCandidate(c).catch(()=>{}));
async function onSig(f,k,d){
  if(k==='typ'){if(chats.some(c=>c.id===d.c)){(typ[d.c]=typ[d.c]||{})[f]=Date.now();showTyp();setTimeout(showTyp,3300)}return}
  if(k==='offer'){
    if(pc||pend)return sig(f,'busy');
    pend={f,d};peer=f;show(f,d.video?'Panggilan video masuk':'Panggilan suara masuk',d.video,true);tmo=setTimeout(()=>endCall(),45000);return;
  }
  if(f!==peer)return;
  if(k==='answer'&&pc){await pc.setRemoteDescription(d);flush()}
  else if(k==='ice'){pc&&pc.remoteDescription?pc.addIceCandidate(d).catch(()=>{}):ice.push(d)}
  else if(k==='end'||k==='busy'){if(k==='busy')toast('Temanmu sedang dalam panggilan lain.');endCall(false)}
}
function endCall(notify=true){
  clearTimeout(tmo);if(notify&&peer&&(pc||pend))sig(peer,'end');
  const p=pc;pc=null;p&&p.close();stream&&stream.getTracks().forEach(t=>t.stop());
  stream=pend=peer=null;ice=[];const c=$('#call');
  if(c){c.hidden=true;$('#rv').srcObject=null;$('#lv').srcObject=null;$('#cm').classList.remove('on')}
}

room.on('sig',onMsg);
document.addEventListener('visibilitychange',()=>{const r=recent[cur];if(r&&r[0])mr(cur,r[0].ts);list()});

  root.innerHTML='<div class="auth"><h1>Obrolan</h1><p class="mu">Isi firebaseConfig di bagian atas file index.html dengan konfigurasi proyek Firebase-mu.</p></div>';
}else{
  root.innerHTML='<p class="mu pad">Memuat…</p>';
  onAuthStateChanged(auth,user=>{

    enter(user.email.split('@')[0]).catch(()=>{root.innerHTML='<div class="auth"><h1>Obrolan</h1><p class="mu">Tidak bisa terhubung ke server. Periksa koneksi lalu muat ulang.</p></div>'});
  });
}
